---
# PostgreSQL credentials Secret
# IMPORTANT: Replace the base64 value before applying.
# To generate: echo -n 'your-strong-password' | base64
# Then store the actual password in a secrets manager (Vault, Sealed Secrets, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: data
  labels:
    app: postgres
type: Opaque
data:
  # Placeholder - MUST be replaced with a real base64-encoded password before apply
  # Example: echo -n 'change-me-before-apply' | base64
  POSTGRES_PASSWORD: Y2hhbmdlLW1lLWJlZm9yZS1hcHBseQ==
  POSTGRES_USER: cG9zdGdyZXM=
  POSTGRES_DB: dGVzdGRi
  # Connection string for postgres-exporter (update password to match above)
  DATA_SOURCE_NAME: cG9zdGdyZXNxbDovL3Bvc3RncmVzOmNoYW5nZS1tZS1iZWZvcmUtYXBwbHlAcG9zdGdyZXMtc3RhdGVmdWwtMC5wb3N0Z3Jlcy1oZWFkbGVzczozMjE0L3Rlc3RkYj9zc2xtb2RlPWRpc2FibGU=
